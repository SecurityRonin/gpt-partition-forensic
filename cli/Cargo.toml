[package]
name = "gpt-forensic-cli"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Command-line tool for forensic inspection of GUID Partition Table (GPT) disk images"
license = "MIT"
repository = "https://github.com/SecurityRonin/gpt-forensic"
homepage = "https://github.com/SecurityRonin/gpt-forensic"
keywords = ["forensics", "gpt", "partition", "cli", "disk-image"]
categories = ["command-line-utilities", "filesystem"]

[[bin]]
name = "gpt"
path = "src/main.rs"

[lib]
name = "gpt_forensic_cli"
path = "src/lib.rs"

[dependencies]
gpt-forensic = { path = "..", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[lints]
workspace = true
