[package]
name = "gpt-partition-forensic"
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Forensic GUID Partition Table (GPT) parser — structure, CRC integrity, primary/backup divergence, and anomaly detection"
repository = "https://github.com/SecurityRonin/gpt-partition-forensic"
keywords = ["forensics", "gpt", "partition", "disk-image", "efi"]
categories = ["parser-implementations", "filesystem"]
exclude = ["fuzz/", ".github/", ".pre-commit-config.yaml", "deny.toml", "renovate.json"]

# `fuzz/` is a standalone cargo-fuzz workspace with its own lockfile.

[dependencies]
gpt = { version = "0.5.0", path = "../core", package = "gpt-partition-core" }
thiserror = "2"
tracing = { version = "0.1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
# Knowledge layer (sibling repo): partition-type names, filesystem magics, and
# the shared `report::Observation` model that findings normalize onto.
forensicnomicon = "0.5"

[features]
default = []
# Forward internal diagnostics to the `tracing` ecosystem.
trace = ["dep:tracing"]
serde = ["dep:serde", "gpt/serde", "forensicnomicon/serde"]

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
