[workspace]
members = ["cli"]
# `fuzz/` is a standalone cargo-fuzz workspace with its own lockfile; keep it out.
exclude = ["fuzz"]

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic                    = { level = "warn", priority = -1 }
module_name_repetitions     = "allow"
must_use_candidate          = "allow"
missing_errors_doc          = "allow"
missing_panics_doc          = "allow"
cast_possible_truncation    = "allow"
cast_possible_wrap          = "allow"
cast_sign_loss              = "allow"

[package]
name = "gpt-forensic"
version = "0.2.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Forensic GUID Partition Table (GPT) parser — structure, CRC integrity, primary/backup divergence, and anomaly detection"
repository = "https://github.com/SecurityRonin/gpt-forensic"
keywords = ["forensics", "gpt", "partition", "disk-image", "efi"]
categories = ["parser-implementations", "filesystem"]
exclude = ["fuzz/", ".github/", ".pre-commit-config.yaml", "deny.toml", "renovate.json"]

[dependencies]
thiserror = "2"
tracing = { version = "0.1", optional = true }
serde = { version = "1", features = ["derive"], optional = true }
# Knowledge layer (sibling repo): GPT partition-type GUID → name table.
forensicnomicon = "0.2.0"

[features]
default = []
# Forward internal diagnostics to the `tracing` ecosystem.
trace = ["dep:tracing"]
serde = ["dep:serde"]

[dev-dependencies]
serde_json = "1"

[lints]
workspace = true
