# The crates.io name `gpt-core` is already taken (third-party `gpt-core` 0.0.6),
# so we publish the reader as `gpt-partition-core` while keeping the ergonomic
# import path `use gpt::…` via the `[lib] name = "gpt"` override below.
[package]
name = "gpt-partition-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pure Read+Seek GUID Partition Table (GPT) reader — header/entry/GUID/CRC32/SHA256/protective-MBR structures"
repository.workspace = true
keywords = ["forensics", "gpt", "partition", "disk-image", "efi"]
categories = ["parser-implementations", "filesystem"]
exclude = ["fuzz/", ".github/", ".pre-commit-config.yaml", "deny.toml", "renovate.json"]

[lib]
name = "gpt"

[dependencies]
thiserror = { workspace = true }
serde = { workspace = true, optional = true }
# Knowledge layer (sibling repo): GPT partition-type GUID → name table and
# partition-attribute flag names. This is a *knowledge base*, not forensic
# findings — the reader stays free of `report::Observation`/anomaly types.
forensicnomicon.workspace = true

[features]
default = []
serde = ["dep:serde", "forensicnomicon/serde"]

[lints]
workspace = true
